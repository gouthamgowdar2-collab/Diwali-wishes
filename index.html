<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Diwali Greeting</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d0b1e;
        }

        .container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(to bottom, #090615 0%, #1a103c 50%, #2c164a 100%);
        }

        /* Greeting Text Overlay */
        .greeting-box {
            position: absolute;
            top: 15%;
            text-align: center;
            z-index: 10;
            padding: 0 20px;
        }

        h1 {
            font-size: 2.5rem;
            color: #fff6cc;
            text-shadow: 0 0 10px #ffcc00, 0 0 20px #ff9900, 0 0 30px #ff6600;
            font-family: 'Georgia', serif;
            letter-spacing: 2px;
            animation: glow 2s ease-in-out infinite alternate;
        }

        .name-container {
            margin-top: 10px;
            font-size: 1.8rem;
            color: #ffffff;
            text-shadow: 0 0 8px #ffcc00;
        }

        @keyframes glow {
            from {
                text-shadow: 0 0 5px #fff, 0 0 10px #ffcc00, 0 0 15px #ff9900;
            }
            to {
                text-shadow: 0 0 10px #fff, 0 0 20px #ffcc00, 0 0 30px #ff6600, 0 0 40px #ff3300;
            }
        }

        /* Background Visuals / Lanterns representation */
        .sky {
            position: absolute;
            width: 100%;
            height: 60%;
            top: 0;
            overflow: hidden;
        }

        .lantern {
            position: absolute;
            width: 30px;
            height: 45px;
            background: rgba(255, 204, 0, 0.8);
            border-radius: 50% 50% 40% 40%;
            box-shadow: 0 0 15px #ffaa00;
            animation: floatUp 6s linear infinite;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) scale(0.8);
                opacity: 0;
            }
            50% {
                opacity: 1;
            }
            100% {
                transform: translateY(-20vh) scale(1.2);
                opacity: 0;
            }
        }

        /* Bottom Action Section */
        .action-footer {
            position: absolute;
            bottom: 30px;
            z-index: 10;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .btn {
            background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
            color: #332200;
            font-weight: bold;
            padding: 12px 30px;
            border: none;
            border-radius: 30px;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(253, 160, 133, 0.4);
            transition: transform 0.2s ease;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .sub-text {
            color: #cccccc;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Floating Lanterns Background -->
        <div class="sky" id="sky"></div>

        <!-- Greeting Text -->
        <div class="greeting-box">
            <h1>Happy Diwali</h1>
            <div class="name-container" id="displayName">from Goutham</div>
        </div>

        <!-- Bottom Buttons -->
        <div class="action-footer">
            <button class="btn" onclick="customiseName()">Add your name & share</button>
            <div class="sub-text">Watch again</div>
        </div>
    </div>

    <script>
        // Check URL parameter for a name, default to Goutham if none provided
        const urlParams = new URLSearchParams(window.location.search);
        const nameParam = urlParams.get('name');
        if (nameParam) {
            document.getElementById('displayName').innerText = 'from ' + decodeURIComponent(nameParam);
        }

        // Allow changing the name dynamically when clicking the button
        function customiseName() {
            const enteredName = prompt("Enter your name for the greeting:", "Goutham");
            if (enteredName) {
                const newUrl = window.location.origin + window.location.pathname + '?name=' + encodeURIComponent(enteredName);
                window.history.pushState({path: newUrl}, '', newUrl);
                document.getElementById('displayName').innerText = 'from ' + enteredName;
                alert("Your personalized link is ready! Copy the browser URL to share with friends.");
            }
        }

        // Generate floating lanterns dynamically
        const sky = document.getElementById('sky');
        function createLantern() {
            const lantern = document.createElement('div');
            lantern.classList.add('lantern');
            lantern.style.left = Math.random() * window.innerWidth + 'px';
            lantern.style.animationDuration = (4 + Math.random() * 4) + 's';
            lantern.style.opacity = Math.random();
            sky.appendChild(lantern);

            setTimeout(() => {
                lantern.remove();
            }, 6000);
        }

        setInterval(createLantern, 600);
    </script>
</body>
</html>
